<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  padding: 1.5rem;
  background: #fdfdfc;
  color: #1b1b19;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 9vw, 4rem);
  font-weight: 600;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: break-word;
}
</style>
</head>
<body>
<h1>Hello, world!</h1>
</body>
</html>

name: Deploy Pages

# The single publish mechanism for the site (PRD-1 §1.4, §6.1 FR-PAGE-3).
# It uploads only `_site`, whose sole content is index.html, so no README,
# docs, skills or template file is reachable under the site URL (PRD-1 §10 SEC-5).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight publish at a time; never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Record the publish directory listing (SEC-5 evidence)
        run: find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the publish directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

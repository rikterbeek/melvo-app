<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melvo — placeholder title</title>
    <meta
      name="description"
      content="PLACEHOLDER — Melvo runs the roles of a software team as AI agents, turning a task into a reviewed pull request."
    />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <!--
      All hero copy below is PLACEHOLDER text (see site/README.md). Every string
      awaiting the product owner's final wording is marked
      data-copy-status="placeholder"; the CTA label and destination are marked
      the same way. Replace the text and the href, keep the data-testid values —
      the tests in tests/hero.test.js bind to them.
    -->
    <header class="site-header">
      <a class="wordmark" href="/">Melvo</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-headline">
        <div class="hero__inner">
          <p class="hero__eyebrow" data-copy-status="placeholder">
            Placeholder eyebrow
          </p>

          <h1
            class="hero__headline"
            id="hero-headline"
            data-testid="hero-headline"
            data-copy-status="placeholder"
          >
            Melvo turns a task into a reviewed pull request
          </h1>

          <p
            class="hero__supporting"
            data-testid="hero-supporting"
            data-copy-status="placeholder"
          >
            Your product, engineering, QA and security roles run as AI agents on
            your own repositories, so your team ships more each week without
            hiring for every seat.
          </p>

          <div class="hero__actions">
            <a
              class="button button--primary"
              href="#request-a-demo"
              data-testid="hero-cta"
              data-copy-status="placeholder"
            >
              Request a demo
            </a>
          </div>
        </div>
      </section>
    </main>
